<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Tickets de Soporte{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'inicio' %}">Mesa de Ayuda</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'inicio' %}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'ticket_list' %}">Tickets</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'categoria_list' %}">Categorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'perfil_list' %}">Perfiles</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'auditoria_list' %}">Auditoria</a></li>
                </ul>
                <a class="btn btn-outline-light btn-sm" href="/api/" target="_blank">API REST</a>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-top py-3 text-center text-muted small">
        Sistema de Gestion de Tickets de Soporte - Programacion Backend
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
