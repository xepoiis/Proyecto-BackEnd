{% extends 'base.html' %}
{% block title %}Confirmar Eliminacion{% endblock %}
{% block content %}
<div class="card border-danger">
    <div class="card-header bg-danger text-white fw-semibold">Confirmar Eliminacion de Registro</div>
    <div class="card-body">
        <p>Esta seguro de que desea eliminar el ticket <strong>#{{ ticket.id }} - {{ ticket.titulo }}</strong>? Esta accion no se puede deshacer.</p>
        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar Eliminacion</button>
            <a href="{% url 'ticket_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
